name: CI — Smart Contracts

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # 1. Compile contracts
  # ───────────────────────────────────────────────
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx hardhat build

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            artifacts/
            cache/
          retention-days: 1

  # ───────────────────────────────────────────────
  # 2. Run test suite
  # ───────────────────────────────────────────────
  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - run: npx hardhat test
        env:
          REPORT_GAS: true

  # ───────────────────────────────────────────────
  # 3. Solidity linter (solhint)
  # ───────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx solhint 'contracts/**/*.sol' 'interfaces/**/*.sol'

  # ───────────────────────────────────────────────
  # 4. Contract size check (EIP-170: 24.576 KB)
  # ───────────────────────────────────────────────
  size-check:
    name: Contract Size
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      # A67 fix: use the same script developers run locally (`npm run size`) instead of
      # a second inline implementation. The inline version only failed above the hard
      # EIP-170 ceiling of 24,576 bytes, so it would have waved through a
      # FloodPredictionContract at 99% — exactly the state the guard exists to prevent.
      # check-contract-sizes.js fails at 95.7% and covers mocks and libraries too.
      - name: Check contract sizes (EIP-170 limit)
        run: node scripts/check-contract-sizes.js

  # ───────────────────────────────────────────────
  # 5. Static analysis (Slither)
  # ───────────────────────────────────────────────
  # A8-12 fix: the pipeline compiled, tested, linted and measured, but never ran a
  # security analyser. solhint checks style, not reentrancy, unchecked return values or
  # dangerous delegatecalls. Slither is the missing layer.
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Analyse the sources directly rather than through the Hardhat platform.
      # crytic-compile reads a build-info file and expects the compiler output inside it
      # under an "output" key — the Hardhat 2 layout. Hardhat 3 splits that in two,
      # <id>.json alongside <id>.output.json, so the lookup raises KeyError: 'output'
      # and Slither aborts before analysing anything. Pointing at contracts/ with the
      # OpenZeppelin remapping uses the plain solc platform and sidesteps it entirely.
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        id: slither
        with:
          node-version: 22
          target: 'contracts/'
          solc-version: 0.8.28
          fail-on: high
          slither-args: >-
            --solc-remaps @openzeppelin=node_modules/@openzeppelin
            --filter-paths "contracts/mocks|node_modules"
            --exclude-dependencies
          sarif: results.sarif

      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-sarif
          path: results.sarif
          retention-days: 14

      # Tell a crash apart from a finding. The previous version mapped every failure of
      # the step above to "high-severity findings", so a tooling crash was reported as a
      # security result — naming the wrong cause, which is worse than not reporting.
      # Slither writes the SARIF only when it actually completes an analysis, so the
      # presence of that file is the discriminator.
      - name: Report Slither outcome
        if: steps.slither.outcome == 'failure'
        run: |
          if [ -f results.sarif ]; then
            echo "::error::Slither reported high-severity findings — see the slither-sarif artifact."
          else
            echo "::error::Slither could not analyse the project and produced no report. This is a tooling failure, not a security finding — check the job log above for the compilation error."
          fi
          exit 1

  # ───────────────────────────────────────────────
  # 6. Dependency audit
  # ───────────────────────────────────────────────
  # A8-12 fix: production dependencies were never audited in CI. A relayer that signs
  # settlement transactions runs on these packages.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ───────────────────────────────────────────────
  # 7. Upgrade safety (UUPS storage layout)
  # ───────────────────────────────────────────────
  # A8-12 fix: FloodPredictionContract and OpalGovernanceUpgradeable are UUPS proxies
  # behind a __gap. A storage-layout mistake is only caught at upgrade time — that is,
  # against a live proxy holding real budget state. Validating the layout on every push
  # moves that discovery to the pull request.
  upgrade-safety:
    name: Upgrade Safety
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Validate UUPS implementations
        run: npx hardhat run scripts/validate-upgrade-safety.js
